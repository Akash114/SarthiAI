openapi: 3.1.0
info:
  title: Sarthi Companion API
  version: 2.0.0
  description: |
    Canonical backend contract for the Sarthi companion rebuild.
    This contract replaces the older MVP resolution/week-1 APIs.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: health
  - name: auth
  - name: users
  - name: goals
  - name: tasks
  - name: teams
  - name: focus-sessions
  - name: brain-dumps
  - name: notifications
  - name: interventions
  - name: preferences
  - name: transparency
  - name: devices
paths:
  /health:
    get:
      security: []
      tags: [health]
      responses:
        "200":
          description: OK
  /ready:
    get:
      security: []
      tags: [health]
      responses:
        "200":
          description: Ready
  /v1/auth/password/register:
    post:
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswordRegisterRequest"
      responses:
        "201":
          description: Verification required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPasswordRegisterResponse"
  /v1/auth/password/verify:
    post:
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswordVerifyRequest"
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
  /v1/auth/password/login:
    post:
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswordLoginRequest"
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
  /v1/auth/google:
    post:
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthGoogleRequest"
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
  /v1/auth/refresh:
    post:
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
      responses:
        "200":
          description: Rotated tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
  /v1/auth/logout:
    post:
      tags: [auth]
      responses:
        "204":
          description: Logged out
  /v1/me:
    get:
      tags: [users]
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatchRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /v1/goals:
    get:
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/status"
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalListResponse"
    post:
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCreateRequest"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
  /v1/goals/{goal_id}:
    parameters:
      - $ref: "#/components/parameters/goalId"
    get:
      tags: [goals]
      responses:
        "200":
          description: Goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    patch:
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalPatchRequest"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
  /v1/goals/{goal_id}/complete:
    post:
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/goalId"
      responses:
        "200":
          description: Completed goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
  /v1/goals/{goal_id}/tasks:
    get:
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/goalId"
        - $ref: "#/components/parameters/status"
      responses:
        "200":
          description: Goal tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
  /v1/tasks:
    get:
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/goalIdQuery"
        - $ref: "#/components/parameters/status"
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
    post:
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /v1/tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/taskId"
    get:
      tags: [tasks]
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    patch:
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatchRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /v1/tasks/{task_id}/complete:
    post:
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/taskId"
      responses:
        "200":
          description: Completed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /v1/tasks/{task_id}/reopen:
    post:
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/taskId"
      responses:
        "200":
          description: Reopened task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /v1/teams:
    get:
      tags: [teams]
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
    post:
      tags: [teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreateRequest"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamCreateResponse"
  /v1/teams/join:
    post:
      tags: [teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamJoinRequest"
      responses:
        "200":
          description: Joined team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetailResponse"
  /v1/teams/{team_id}:
    parameters:
      - $ref: "#/components/parameters/teamIdPath"
    get:
      tags: [teams]
      responses:
        "200":
          description: Team detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetailResponse"
    delete:
      tags: [teams]
      responses:
        "204":
          description: Deleted team
  /v1/teams/{team_id}/leave:
    post:
      tags: [teams]
      parameters:
        - $ref: "#/components/parameters/teamIdPath"
      responses:
        "204":
          description: Left team
  /v1/focus-sessions:
    get:
      tags: [focus-sessions]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Focus session history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionListPage"
  /v1/focus-sessions/active:
    get:
      tags: [focus-sessions]
      responses:
        "200":
          description: Active focus session or null
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/FocusSession"
                  - type: "null"
  /v1/focus-sessions/start:
    post:
      tags: [focus-sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionStartRequest"
      responses:
        "201":
          description: Started focus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
  /v1/focus-sessions/{session_id}/end:
    post:
      tags: [focus-sessions]
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Ended focus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
  /v1/brain-dumps:
    get:
      tags: [brain-dumps]
      responses:
        "200":
          description: Brain dumps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainDumpListPage"
    post:
      tags: [brain-dumps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrainDumpCreateRequest"
      responses:
        "201":
          description: Captured brain dump
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainDump"
  /v1/focus-sessions/{session_id}/brain-dumps:
    post:
      tags: [brain-dumps, focus-sessions]
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrainDumpCreateRequest"
      responses:
        "201":
          description: Captured focus brain dump
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainDump"
  /v1/brain-dumps/{dump_id}:
    get:
      tags: [brain-dumps]
      parameters:
        - $ref: "#/components/parameters/dumpId"
      responses:
        "200":
          description: Brain dump
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainDump"
  /v1/brain-dumps/{dump_id}/apply:
    post:
      tags: [brain-dumps]
      parameters:
        - $ref: "#/components/parameters/dumpId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrainDumpApplyRequest"
      responses:
        "200":
          description: Applied proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainDumpApplyResponse"
  /v1/notifications:
    get:
      tags: [notifications]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionNotificationListResponse"
  /v1/interventions:
    get:
      tags: [interventions]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            default: pending
      responses:
        "200":
          description: Interventions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterventionListResponse"
  /v1/interventions/{intervention_id}/resolve:
    post:
      tags: [interventions]
      parameters:
        - name: intervention_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resolved intervention
          content:
            application/json:
              schema:
                type: object
  /v1/preferences:
    get:
      tags: [preferences]
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingPreferencesState"
    patch:
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachingPreferencesPatchRequest"
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingPreferencesState"
  /v1/transparency:
    get:
      tags: [transparency]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Transparency log page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransparencyLogPage"
  /v1/notifications/config:
    get:
      security: []
      tags: [devices]
      responses:
        "200":
          description: Push provider config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsConfigResponse"
  /v1/devices/push-token:
    post:
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRegisterRequest"
      responses:
        "204":
          description: Registered
    delete:
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRegisterRequest"
      responses:
        "204":
          description: Removed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    status:
      name: status
      in: query
      schema:
        type: string
        default: active
    teamId:
      name: team_id
      in: query
      schema:
        type: string
        format: uuid
    teamIdPath:
      name: team_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    goalId:
      name: goal_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    goalIdQuery:
      name: goal_id
      in: query
      schema:
        type: string
        format: uuid
    taskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    dumpId:
      name: dump_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    UserProfile:
      type: object
      required: [id, email, auth_methods]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: [string, "null"] }
        profile_image_url: { type: [string, "null"] }
        profile_source: { type: [string, "null"] }
        email_verified_at: { type: [string, "null"], format: date-time }
        auth_methods:
          type: array
          items:
            type: object
    ProfilePatchRequest:
      type: object
      properties:
        display_name: { type: [string, "null"], maxLength: 160 }
        profile_image_url: { type: [string, "null"], maxLength: 2048 }
    AuthPasswordRegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 256 }
        display_name: { type: [string, "null"] }
    AuthPasswordRegisterResponse:
      type: object
      required: [user_id, email, verification_required]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        verification_required: { type: boolean }
        verification_code: { type: [string, "null"] }
    AuthPasswordVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string }
    AuthPasswordLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthGoogleRequest:
      type: object
      required: [id_token]
      properties:
        id_token: { type: string }
    AuthRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    AuthTokenResponse:
      type: object
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at, user]
      properties:
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
        user:
          $ref: "#/components/schemas/UserProfile"
    GoalCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: [string, "null"] }
        team_id: { type: [string, "null"], format: uuid }
        target_at: { type: [string, "null"], format: date-time }
        metadata_json: { type: [object, "null"] }
    GoalPatchRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: [string, "null"] }
        status: { type: string, enum: [active, completed, archived] }
        target_at: { type: [string, "null"], format: date-time }
        progress_summary: { type: [string, "null"] }
        metadata_json: { type: [object, "null"] }
    Goal:
      type: object
      additionalProperties: true
    GoalListResponse:
      type: object
      required: [goals]
      properties:
        goals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
    TaskCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        notes: { type: [string, "null"] }
        goal_id: { type: [string, "null"], format: uuid }
        team_id: { type: [string, "null"], format: uuid }
        assignee_user_id: { type: [string, "null"], format: uuid }
        priority: { type: string, enum: [low, normal, high], default: normal }
        due_at: { type: [string, "null"], format: date-time }
    TaskPatchRequest:
      type: object
      additionalProperties: true
    Task:
      type: object
      additionalProperties: true
    TaskListResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    TeamJoinRequest:
      type: object
      required: [invite_code]
      properties:
        invite_code: { type: string }
    TeamCreateResponse:
      type: object
      additionalProperties: true
    TeamDetailResponse:
      type: object
      additionalProperties: true
    TeamListResponse:
      type: object
      additionalProperties: true
    FocusSessionStartRequest:
      type: object
      properties:
        task_id: { type: [string, "null"], format: uuid }
    FocusSession:
      type: object
      additionalProperties: true
    FocusSessionSummary:
      type: object
      required: [id, started_at, elapsed_seconds]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: [string, "null"], format: uuid }
        task_title: { type: [string, "null"] }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        elapsed_seconds: { type: integer }
    FocusSessionListPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FocusSessionSummary"
        next_cursor: { type: [string, "null"] }
    CompanionNotification:
      type: object
      additionalProperties: true
    CompanionNotificationListResponse:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/CompanionNotification"
    Intervention:
      type: object
      additionalProperties: true
    InterventionListResponse:
      type: object
      required: [interventions]
      properties:
        interventions:
          type: array
          items:
            $ref: "#/components/schemas/Intervention"
    CoachingPreferencesState:
      type: object
      additionalProperties: true
    CoachingPreferencesPatchRequest:
      type: object
      additionalProperties: true
    BrainDumpCreateRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
        focus_session_id: { type: [string, "null"], format: uuid }
        task_id: { type: [string, "null"], format: uuid }
        goal_id: { type: [string, "null"], format: uuid }
        team_id: { type: [string, "null"], format: uuid }
    BrainDump:
      type: object
      additionalProperties: true
    BrainDumpListPage:
      type: object
      additionalProperties: true
    BrainDumpApplyRequest:
      type: object
      properties:
        proposal_ids:
          type: array
          items: { type: string, format: uuid }
    BrainDumpApplyResponse:
      type: object
      additionalProperties: true
    TransparencyEntry:
      type: object
      required: [id, action_type, headline, created_at]
      properties:
        id: { type: string, format: uuid }
        action_type: { type: string }
        headline: { type: string }
        detail: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        metadata_json: { type: [object, "null"] }
    TransparencyLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransparencyEntry"
        next_cursor: { type: [string, "null"] }
    NotificationsConfigResponse:
      type: object
      required: [enabled, provider]
      properties:
        enabled: { type: boolean }
        provider: { type: string, enum: [expo, noop] }
    PushTokenRegisterRequest:
      type: object
      required: [expo_push_token, platform]
      properties:
        expo_push_token: { type: string }
        platform: { type: string, enum: [android, ios] }
        device_id: { type: string }

openapi: 3.1.0
info:
  title: Sarthi API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    Public HTTP API for Sarthi v1 (Android-first).

    ## Changelog policy

    - **Patch (1.0.x):** Documentation-only or clarifications that do not change wire compatibility.
    - **Additive (1.x.0):** New optional fields on responses, new optional query parameters, new endpoints, new enum values **only** when clients are written to ignore unknown values. Prefer additive evolution within `/v1` while Android v1 is live.
    - **Breaking:** Renames, removed fields, changed types, new required fields on requests, or semantic changes require **`/v2`** (or a negotiated major version) and a migration window documented in ADRs.

    ## Idempotency

    Clients **may** send `Idempotency-Key` (unique string, stable per logical retry) on marked mutating requests. Servers **must** deduplicate such that retries return the same successful outcome without duplicate side effects.

    ## Errors

    Failed requests return JSON bodies matching `Error` unless otherwise noted. HTTP status reflects class of failure (4xx client, 5xx server).

    ## Legacy API (`old/` reference) vs v1

    The pre-production tree under `old/` exposed **unversioned** routes (no `/v1` prefix) and a broader surface area. Android v1 clients **must** use `/v1` only. Intentional differences:

    | Area | Legacy (`old/docs/backend_reference.md`) | v1 (`/v1` here) |
    | --- | --- | --- |
    | Versioning | Flat `/` routes | All product routes under `/v1` |
    | Ops / jobs | `GET /jobs`, `POST /jobs/run-now` (debug-gated) | `GET /v1/ops/jobs`, `POST /v1/ops/jobs/run` with `X-Ops-Key` when `OPS_API_KEY` is set; returns **404** if ops is not configured |
    | Agent / transparency | `GET /agent-log` (cursor on `AgentActionLog`) | `GET /v1/transparency-log` (same UX goal; current schema in components) |
    | Tasks | `GET /tasks` (user-wide, filters) | `GET /v1/resolutions/{id}/tasks` (week-1 tasks for that resolution); aligns with single-resolution v1 scope |
    | Resolution lifecycle | Intake → `decompose` → `approve` | Single active resolution + `POST .../generate-week-1` (async) per [product scope](../product/v1-scope.md) |
    | Weekly plan (rolling) | `GET/POST /weekly-plan/*`, `GET/POST /interventions/*` snapshot APIs | Resolution-scoped preview/history (`week-1/preview`, `plan-history`, `plan-snapshots/{id}`) plus current intervention flow |
    | Notifications config | `GET /notifications/config` | `GET /v1/notifications/config` |

    Compatibility shims for legacy paths are **out of scope** for v1; migrate clients to OpenAPI operations in this file.

servers:
  - url: "{scheme}://{host}"
    description: Configurable API origin (no default localhost in spec; set variables per environment)
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: api.sarthi.invalid
        description: >
          Replace with the real production host when known. Use a dev host
          value in local tooling (not embedded here to satisfy generic lint rules).

tags:
  - name: auth
    description: Registration, session tokens, logout
  - name: users
    description: Current user profile
  - name: onboarding
    description: First-run onboarding state machine
  - name: resolutions
    description: Single active resolution and week-1 plan generation
  - name: tasks
    description: Week-1 actionable tasks
  - name: interventions
    description: Single v1 intervention path with explicit approval
  - name: transparency
    description: User-visible major system actions
  - name: devices
    description: Push notification registration
  - name: weekly-plan
    description: Week-1 preview and plan snapshot history
  - name: dashboard
    description: Aggregated progress for the home surface
  - name: journey
    description: Daily task focus
  - name: ops
    description: Operational controls (requires X-Ops-Key when configured)
  - name: health
    description: Liveness and readiness (not part of authenticated product API)
  - name: preferences
    description: Coaching nudges and reminder toggles
  - name: brain-dump
    description: Free-text reflection capture and signal extraction
  - name: focus-sessions
    description: Focus companion session start/end for analytics

paths:
  /health:
    get:
      tags: [health]
      operationId: health_liveness
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object

  /ready:
    get:
      tags: [health]
      operationId: health_readiness
      summary: Readiness probe (database + Redis)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
        "503":
          description: Dependency unavailable
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: auth_register
      summary: Register a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "201":
          description: Created; returns tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many auth requests from this client (rate limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: auth_login
      summary: Obtain tokens with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many auth requests from this client (rate limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: auth_refresh
      summary: Rotate access token using refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          description: Invalid or revoked refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many auth requests from this client (rate limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: auth_logout
      summary: Revoke current refresh token (and optionally all sessions)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLogoutRequest"
      responses:
        "204":
          description: Logged out
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/merge-anonymous:
    post:
      tags: [auth]
      operationId: auth_merge_anonymous
      summary: Merge a pre-account user id into the authenticated account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeAnonymousRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeAnonymousResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Both accounts have data that cannot be merged automatically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/me:
    get:
      tags: [users]
      operationId: me_get
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/onboarding:
    get:
      tags: [onboarding]
      operationId: onboarding_get
      summary: Get onboarding state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [onboarding]
      operationId: onboarding_patch
      summary: Advance or update onboarding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingPatchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/preferences:
    get:
      tags: [preferences]
      operationId: preferences_get
      summary: Get coaching preferences for reminders and interventions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingPreferencesState"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [preferences]
      operationId: preferences_patch
      summary: Update coaching preferences
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachingPreferencesPatchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingPreferencesState"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/brain-dump:
    post:
      tags: [brain-dump]
      operationId: brain_dump_create
      summary: Store a brain dump and return extracted signals
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrainDumpRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainDumpResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/brain-dumps:
    get:
      tags: [brain-dump]
      operationId: brain_dump_list
      summary: List brain dumps for the current user (newest first)
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainDumpListPage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/brain-dumps/{dump_id}:
    get:
      tags: [brain-dump]
      operationId: brain_dump_get
      summary: Get a single brain dump with full body and signals
      security:
        - bearerAuth: []
      parameters:
        - name: dump_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainDumpDetailResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/resolutions/current:
    get:
      tags: [resolutions]
      operationId: resolutions_current_get
      summary: Get the current active resolution if any
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK (body may be null when none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolutionCurrentResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/resolutions:
    post:
      tags: [resolutions]
      operationId: resolutions_create
      summary: Create a resolution (fails if another is active)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolutionCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resolution"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Active resolution already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/resolutions/{resolution_id}:
    parameters:
      - $ref: "#/components/parameters/ResolutionId"
    get:
      tags: [resolutions]
      operationId: resolutions_get
      summary: Get resolution by id
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resolution"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [resolutions]
      operationId: resolutions_patch
      summary: Update or complete a resolution
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolutionPatchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resolution"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/resolutions/{resolution_id}/generate-week-1:
    post:
      tags: [resolutions]
      operationId: resolutions_generate_week_1
      summary: Enqueue or run week-1 plan generation for the resolution
      description: |
        Idempotent: replays with the same `Idempotency-Key` must not create duplicate tasks.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResolutionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Accepted (async job) or 200 if synchronous implementation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateWeek1Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Week-1 already generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/resolutions/{resolution_id}/tasks:
    get:
      tags: [tasks]
      operationId: tasks_list_week_1
      summary: List week-1 tasks for a resolution
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResolutionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/tasks/{task_id}:
    get:
      tags: [tasks]
      operationId: task_get
      summary: Get a single task by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [tasks]
      operationId: task_patch
      summary: Update task fields (title, note in metadata, optional status and sort_order)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/tasks/{task_id}/complete:
    post:
      tags: [tasks]
      operationId: tasks_complete
      summary: Mark a task complete (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK (already complete is still 200)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/tasks/{task_id}/skip:
    post:
      tags: [tasks]
      operationId: tasks_skip
      summary: Mark a task skipped (idempotent if already skipped)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/focus-sessions:
    get:
      tags: [focus-sessions]
      operationId: focus_session_list
      summary: List recent focus sessions for the current user
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [focus-sessions]
      operationId: focus_session_create
      summary: Start a focus session for a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionCreateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/focus-sessions/{session_id}:
    patch:
      tags: [focus-sessions]
      operationId: focus_session_patch
      summary: End a focus session
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionPatchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/interventions/current:
    get:
      tags: [interventions]
      operationId: interventions_current_get
      summary: Get current pending intervention if any
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterventionCurrentResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/interventions/{intervention_id}/approve:
    post:
      tags: [interventions]
      operationId: interventions_approve
      summary: Approve the pending intervention
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InterventionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intervention"
        "400":
          description: Not pending or invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/interventions/{intervention_id}/dismiss:
    post:
      tags: [interventions]
      operationId: interventions_dismiss
      summary: Dismiss the pending intervention (product “reject” / decline path for v1)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InterventionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intervention"
        "400":
          description: Not pending or invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/transparency-log/{entry_id}:
    get:
      tags: [transparency]
      operationId: transparency_log_entry_get
      summary: Fetch one transparency log entry
      security:
        - bearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransparencyEntry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/transparency-log:
    get:
      tags: [transparency]
      operationId: transparency_log_list
      summary: Page through transparency log entries (newest first)
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from previous response
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: action_type
          in: query
          required: false
          schema:
            type: string
          description: Filter by stable action_type key
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransparencyLogPage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/devices/push-token:
    delete:
      tags: [devices]
      operationId: devices_push_token_unregister
      summary: Remove a registered Expo push token for this user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRegisterRequest"
      responses:
        "204":
          description: Removed or already absent
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [devices]
      operationId: devices_push_token_register
      summary: Register or replace Expo push token for this device
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRegisterRequest"
      responses:
        "204":
          description: Stored
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/notifications/config:
    get:
      tags: [devices]
      operationId: notifications_config_get
      summary: Push notification feature flags for the client
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsConfigResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object

  /v1/resolutions/{resolution_id}/week-1/preview:
    post:
      tags: [weekly-plan]
      operationId: week1_preview_create
      summary: Generate a week-1 preview and store a snapshot record
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResolutionId"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Week1PreviewResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/resolutions/{resolution_id}/plan-history:
    get:
      tags: [weekly-plan]
      operationId: plan_history_list
      summary: List plan snapshots for a resolution
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResolutionId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanHistoryResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/plan-snapshots/{snapshot_id}:
    get:
      tags: [weekly-plan]
      operationId: plan_snapshot_get
      summary: Fetch a single plan snapshot by id
      security:
        - bearerAuth: []
      parameters:
        - name: snapshot_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanSnapshotDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/dashboard:
    get:
      tags: [dashboard]
      operationId: dashboard_get
      summary: Aggregated resolution and intervention summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/journey/daily:
    get:
      tags: [journey]
      operationId: journey_daily_get
      summary: Open tasks for the current focus (week-1 loop)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyJourneyResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/interventions/history:
    get:
      tags: [interventions]
      operationId: interventions_history_list
      summary: Past non-pending interventions for the user
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Intervention"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/ops/jobs:
    get:
      tags: [ops]
      operationId: ops_jobs_config
      summary: Scheduler-oriented job catalog (requires X-Ops-Key)
      security: []
      parameters:
        - name: X-Ops-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsJobsConfigResponse"
        "401":
          description: Invalid ops key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Ops disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/ops/jobs/run:
    post:
      tags: [ops]
      operationId: ops_jobs_run
      summary: Run an operational job (requires X-Ops-Key)
      security: []
      parameters:
        - name: X-Ops-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpsJobRunRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsJobRunResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid ops key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Ops disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Unique key for safe retries on supporting mutations

    ResolutionId:
      name: resolution_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    InterventionId:
      name: intervention_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable summary safe to show or log
        request_id:
          type: string
          description: Correlates to server logs / tracing
        details:
          type: object
          additionalProperties: true
          description: Optional structured context (avoid PII)

    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email

    AuthRegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 256

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AuthLogoutRequest:
      type: object
      properties:
        revoke_all:
          type: boolean
          default: false
          description: If true, revoke all refresh tokens for the user

    AuthTokenResponse:
      type: object
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at]
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time

    MergeAnonymousRequest:
      type: object
      required: [anonymous_user_id]
      properties:
        anonymous_user_id:
          type: string
          format: uuid

    MergeAnonymousResponse:
      type: object
      required: [merged, message]
      properties:
        merged:
          type: boolean
        message:
          type: string

    OnboardingState:
      type: object
      required: [status, step]
      properties:
        status:
          type: string
          enum: [not_started, in_progress, completed]
        step:
          type: string
          description: Opaque step key for client UI routing
        updated_at:
          type: string
          format: date-time

    OnboardingPatchRequest:
      type: object
      properties:
        step:
          type: string
        mark_completed:
          type: boolean
          default: false

    CoachingPreferencesState:
      type: object
      required: [coaching_paused, task_reminders_enabled, interventions_enabled]
      properties:
        coaching_paused:
          type: boolean
        task_reminders_enabled:
          type: boolean
        interventions_enabled:
          type: boolean
        timezone:
          type: string
          maxLength: 64
        updated_at:
          type: string
          format: date-time
        home_segment_index:
          type: integer
          minimum: 0
          maximum: 1
          default: 0
          description: Home segmented control — 0 Personal, 1 Work

    CoachingPreferencesPatchRequest:
      type: object
      properties:
        coaching_paused:
          type: boolean
        task_reminders_enabled:
          type: boolean
        interventions_enabled:
          type: boolean
        timezone:
          type: string
          maxLength: 64
        home_segment_index:
          type: integer
          minimum: 0
          maximum: 1

    BrainDumpRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 20000

    BrainDumpResponse:
      type: object
      required: [id, actionable, signals]
      properties:
        id:
          type: string
          format: uuid
        actionable:
          type: boolean
        signals:
          type: object
          additionalProperties: true

    BrainDumpListItem:
      type: object
      required: [id, created_at, excerpt, actionable]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        excerpt:
          type: string
        actionable:
          type: boolean

    BrainDumpListPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BrainDumpListItem"
        next_cursor:
          type: string
          nullable: true

    BrainDumpDetailResponse:
      type: object
      required: [id, body, actionable, signals, created_at]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        actionable:
          type: boolean
        signals:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    Resolution:
      type: object
      required: [id, title, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        detail:
          type: string
          maxLength: 8000
          description: User brain-dump text; treat as sensitive in logs
        status:
          type: string
          enum: [draft, active, completed, abandoned]
        week_1_plan_status:
          type: string
          enum: [not_requested, pending, ready, failed]
        plan_metadata_json:
          description: Opaque planner metadata (version, source, counts)
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ResolutionCurrentResponse:
      type: object
      required: [resolution]
      properties:
        resolution:
          anyOf:
            - $ref: "#/components/schemas/Resolution"
            - type: "null"

    ResolutionCreateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        detail:
          type: string
          maxLength: 8000

    ResolutionPatchRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        detail:
          type: string
          maxLength: 8000
        status:
          type: string
          enum: [draft, active, completed, abandoned]

    GenerateWeek1Response:
      type: object
      required: [week_1_plan_status]
      properties:
        week_1_plan_status:
          type: string
          enum: [not_requested, pending, ready, failed]
        job_id:
          type: string
          description: Present when accepted asynchronously

    Week1PreviewTask:
      type: object
      required: [title, sort_order]
      properties:
        title:
          type: string
        sort_order:
          type: integer

    Week1PreviewResponse:
      type: object
      required: [planner_version, source, tasks, snapshot_id]
      properties:
        planner_version:
          type: string
        source:
          type: string
          description: heuristic or openai
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Week1PreviewTask"
        snapshot_id:
          type: string
          format: uuid

    PlanSnapshotItem:
      type: object
      required: [id, kind, planner_version, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        planner_version:
          type: string
        created_at:
          type: string
          format: date-time

    PlanSnapshotDetail:
      type: object
      required: [id, kind, planner_version, tasks, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        planner_version:
          type: string
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Week1PreviewTask"
        created_at:
          type: string
          format: date-time

    PlanHistoryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanSnapshotItem"

    DashboardResolutionSummary:
      type: object
      required: [id, title, week_1_plan_status, open_tasks, completed_tasks]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        week_1_plan_status:
          type: string
        open_tasks:
          type: integer
        completed_tasks:
          type: integer
        skipped_tasks:
          type: integer
          description: Count of skipped tasks for the active resolution (additive field; default 0 when absent)

    DashboardResponse:
      type: object
      required: [resolution, pending_intervention]
      properties:
        resolution:
          anyOf:
            - $ref: "#/components/schemas/DashboardResolutionSummary"
            - type: "null"
        pending_intervention:
          type: boolean

    JourneyTaskItem:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
        due_window_ends_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    DailyJourneyResponse:
      type: object
      required: [date, tasks]
      properties:
        date:
          type: string
          format: date-time
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/JourneyTaskItem"

    NotificationsConfigResponse:
      type: object
      required: [enabled, provider]
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum: [expo, noop]

    OpsJobsConfigResponse:
      type: object
      required: [scheduler_enabled, timezone, jobs]
      properties:
        scheduler_enabled:
          type: boolean
        timezone:
          type: string
        jobs:
          type: array
          items:
            type: object
            required: [id, description]
            properties:
              id:
                type: string
              description:
                type: string

    OpsJobRunRequest:
      type: object
      required: [job]
      properties:
        job:
          type: string
          enum: [reminders, week1_recover]
        resolution_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"

    OpsJobRunResponse:
      type: object
      required: [job, processed]
      properties:
        job:
          type: string
        processed:
          type: integer
        detail:
          oneOf:
            - type: string
            - type: "null"

    Task:
      type: object
      required: [id, resolution_id, title, status, sort_order]
      properties:
        id:
          type: string
          format: uuid
        resolution_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [open, completed, skipped]
        sort_order:
          type: integer
        due_window_starts_at:
          type: string
          format: date-time
        due_window_ends_at:
          type: string
          format: date-time
        metadata_json:
          type: object
          additionalProperties: true

    TaskPatchRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 500
        note:
          type: string
          maxLength: 500
          description: Empty string clears the note
        status:
          type: string
          enum: [open, completed, skipped]
        sort_order:
          type: integer
          minimum: 0
          maximum: 100000

    TaskListResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"

    Intervention:
      type: object
      required: [id, status, summary]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, dismissed, expired]
        summary:
          type: string
          maxLength: 2000
        detail_json:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    FocusSessionCreateRequest:
      type: object
      required: [task_id]
      properties:
        task_id:
          type: string
          format: uuid
        planned_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          nullable: true

    FocusSessionPatchRequest:
      type: object
      properties:
        ended_at:
          type: string
          format: date-time
          nullable: true

    FocusSessionResponse:
      type: object
      required: [id, user_id, started_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          nullable: true
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        planned_seconds:
          type: integer
          nullable: true

    FocusSessionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FocusSessionResponse"

    InterventionCurrentResponse:
      type: object
      required: [intervention]
      properties:
        intervention:
          anyOf:
            - $ref: "#/components/schemas/Intervention"
            - type: "null"

    TransparencyEntry:
      type: object
      required: [id, action_type, headline, created_at]
      properties:
        id:
          type: string
          format: uuid
        action_type:
          type: string
          description: Stable taxonomy key, e.g. `plan_generated`
        headline:
          type: string
          maxLength: 500
        detail:
          type: string
          maxLength: 4000
        created_at:
          type: string
          format: date-time

    TransparencyLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransparencyEntry"
        next_cursor:
          type: ["string", "null"]
          description: Null when no further pages

    PushTokenRegisterRequest:
      type: object
      required: [expo_push_token, platform]
      properties:
        expo_push_token:
          type: string
        platform:
          type: string
          enum: [android, ios]
        device_id:
          type: string
          maxLength: 128
          description: Optional stable device identifier from app install

security:
  - bearerAuth: []

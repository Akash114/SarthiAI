services:
  redis:
    image: redis:7-alpine
    container_name: sarthiai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: sarthiai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Sarthi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Sarthi"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sarthiai_postgres_data:/var/lib/postgresql/data

volumes:
  sarthiai_postgres_data:

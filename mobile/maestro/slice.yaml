# Companion smoke: register → verify → onboarding → home.
# Requires dev backend that returns verification_code on register.
appId: host.exp.exponent
---
- launchApp
- assertVisible:
    id: "auth-root"
- tapOn:
    id: "auth-register-btn"
- tapOn:
    id: "auth-email-input"
- inputRandomEmail
- tapOn:
    id: "auth-password-input"
- inputText: "password123"
- tapOn:
    id: "auth-login-btn"
- assertVisible:
    id: "auth-dev-code"
- tapOn:
    id: "auth-verify-btn"
- assertVisible:
    id: "onboarding-welcome-continue"
- tapOn:
    id: "onboarding-welcome-continue"
- tapOn:
    id: "onboarding-personalize-continue"
- tapOn:
    id: "onboarding-notifications-skip"
- tapOn:
    id: "onboarding-finish-btn"
- assertVisible:
    id: "home-root"
